name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove files that must not be published
        run: |
          # Runs on the CI checkout only, before indexing, so the search index and site stay consistent.
          # Only PDFs are published; contacts, spreadsheets, Word files and images are removed.
          find pdfs -type f ! -iname '*.pdf' -delete
          # Customer-named rental quotes and the price list.
          rm -rf "pdfs/XYLEM/FLOW METER RENTAL"
          rm -f "pdfs/XYLEM/B&G - MASTER PRICE LIST.pdf"
      - run: npm test
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r app _site/app
          cp -r pdfs _site/pdfs
          # Manual links are ../pdfs/... relative to app/, so keep that layout.
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=app/"><title>HVAC Troubleshooter</title><a href="app/">HVAC Troubleshooter</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
